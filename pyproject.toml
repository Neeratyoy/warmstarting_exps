[project]
name = "warms"
version = "0.1.0"
description = "Experiment repository for warmstarting LLMs"
authors = [
    {name = "Neeratyoy Mallik", email = "mallik@cs.uni-freiburg.de"},
    {name = "Maciej Janowski", email = "janowski@cs.uni-freiburg.de"},
    {name = "Johannes Hog", email = "hogj@cs.uni-freiburg.de"},
    {name = "Herilalaina Rakotoarison", email = "rakotoah@cs.uni-freiburg.de"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy>=1.0,<2.0",
    "toml>=0.10.2,<0.11.0",
]

[project.urls]
repository = "https://github.com/yourusername/warms"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warms"]