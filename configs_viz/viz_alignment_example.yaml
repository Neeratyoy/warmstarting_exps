      run_names: # list[str]
        - "[0-2] muP"
        - "[0-4] muP"
      x_axis: flops
      metric: Validation Loss
      remove_x_labels: true
      remove_y_labels: true
      remove_legend: false
      x_limits: null # tuple[float, float] | None
      y_limits: null
      y_scale: log
      x_scale: log
